    <text class="f" x="471.2" y="492.0" font-size="12" font-weight="700" fill="#B9806A" letter-spacing="0.5">BORROW</text>
    <text class="f" x="471.2" y="514.0" font-size="21" font-weight="800" fill="#231A15">조사·차용</text>
    <text class="f" x="433.2" y="541.0" font-size="14" fill="#5E4B42">GitHub 트렌딩, 공개 스킬</text>
