  <text class="f" x="340" y="420" font-size="24" font-weight="800" fill="#231A15" text-anchor="middle">매일 새벽 6시</text>
  <text class="f" x="340" y="446" font-size="15" fill="#5E4B42" text-anchor="middle">뉴욕 시간, 주말 포함</text>
  <g>
