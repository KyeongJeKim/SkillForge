  <g>
    <rect x="415.2" y="264.0" width="196" height="92" rx="18" fill="#FFFFFF" stroke="#EBD5C3" stroke-width="2"/>
    <circle cx="445.2" cy="294.0" r="16" fill="url(#num)"/>
