    <text class="f" x="298.0" y="592.0" font-size="12" font-weight="700" fill="#B9806A" letter-spacing="0.5">IMPROVE</text>
    <text class="f" x="298.0" y="614.0" font-size="21" font-weight="800" fill="#231A15">개선</text>
    <text class="f" x="260.0" y="641.0" font-size="14" fill="#5E4B42">한 번에 1~3가지</text>
  </g>
  <g>
