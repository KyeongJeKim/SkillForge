<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="t">
  <title id="t">SkillForge 재귀적 자기개선(RSI): 매일 측정, 약점 찾기, GitHub 조사·차용, 개선, 고정 시험지로 재측정, 나아졌을 때만 채택하고 기록. 만든 스킬도 사용자의 수정에서 배웁니다.</title>
  <defs>
    <style>.f { font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", Helvetica, Arial, sans-serif; } .m { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }</style>
    <linearGradient id="num" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F08A4B"/><stop offset="1" stop-color="#D9622B"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF1E6"/><stop offset="1" stop-color="#FFE3CF"/></linearGradient>
