  <rect x="666" y="112" width="504" height="364" rx="22" fill="#FFFFFF" stroke="#E2D4F0" stroke-width="2"/>
  <text class="f" x="694" y="152" font-size="14" font-weight="700" fill="#8B6BBE" letter-spacing="1.5">AND THE SKILLS IT BUILDS</text>
  <text class="f" x="694" y="186" font-size="24" font-weight="800" fill="#231A15">만든 스킬도 쓸수록 배웁니다</text>
  <circle cx="710" cy="236" r="14" fill="#F1EAFA" stroke="#8B6BBE" stroke-width="2"/>
  <text class="f" x="710" y="241" font-size="14" font-weight="800" fill="#6A4C9C" text-anchor="middle">1</text>
  <text class="f" x="738" y="234" font-size="18" font-weight="700" fill="#231A15">사용자가 결과를 고침</text>
  <text class="f" x="738" y="258" font-size="14.5" fill="#5E4B42">“다음부터는 요일까지 써 주세요”</text>
  <line x1="710" y1="252" x2="710" y2="278" stroke="#8B6BBE" stroke-width="2.5" marker-end="url(#ar2)"/>
  <circle cx="710" cy="302" r="14" fill="#F1EAFA" stroke="#8B6BBE" stroke-width="2"/>
  <text class="f" x="710" y="307" font-size="14" font-weight="800" fill="#6A4C9C" text-anchor="middle">2</text>
  <text class="f" x="738" y="300" font-size="18" font-weight="700" fill="#231A15">규칙을 기록</text>
  <text class="f" x="738" y="324" font-size="14.5" fill="#5E4B42">스킬 폴더의 corrections.md 에 한 줄</text>
  <line x1="710" y1="318" x2="710" y2="344" stroke="#8B6BBE" stroke-width="2.5" marker-end="url(#ar2)"/>
  <circle cx="710" cy="368" r="14" fill="#F1EAFA" stroke="#8B6BBE" stroke-width="2"/>
  <text class="f" x="710" y="373" font-size="14" font-weight="800" fill="#6A4C9C" text-anchor="middle">3</text>
  <text class="f" x="738" y="366" font-size="18" font-weight="700" fill="#231A15">다음 결과부터 바로 반영</text>
  <text class="f" x="738" y="390" font-size="14.5" fill="#5E4B42">고객 정보 없이 규칙만</text>
  <line x1="710" y1="384" x2="710" y2="410" stroke="#8B6BBE" stroke-width="2.5" marker-end="url(#ar2)"/>
  <circle cx="710" cy="434" r="14" fill="#F1EAFA" stroke="#8B6BBE" stroke-width="2"/>
  <text class="f" x="710" y="439" font-size="14" font-weight="800" fill="#6A4C9C" text-anchor="middle">4</text>
  <text class="f" x="738" y="432" font-size="18" font-weight="700" fill="#231A15">“이 스킬 개선해 줘”</text>
  <text class="f" x="738" y="456" font-size="14.5" fill="#5E4B42">forge-improve 가 본문에 반영하고 재시험</text>
  <text class="f" x="670" y="516" font-size="14" font-weight="700" fill="#B9806A" letter-spacing="1.5">GUARDRAILS · 지키는 규칙</text>
  <rect x="666" y="532" width="504" height="40" rx="20" fill="#FFF3EA" stroke="#F0C9AD" stroke-width="1.5"/>
  <path d="M684 552 l5 5 l10 -11" fill="none" stroke="#D9622B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="f" x="708" y="558" font-size="16" font-weight="600" fill="#5E3A28">고정 시험지(held-out)는 개선 루틴이 수정하지 않음</text>
  <rect x="666" y="580" width="504" height="40" rx="20" fill="#FFF3EA" stroke="#F0C9AD" stroke-width="1.5"/>
  <path d="M684 600 l5 5 l10 -11" fill="none" stroke="#D9622B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="f" x="708" y="606" font-size="16" font-weight="600" fill="#5E3A28">점수가 오르고 떨어진 곳이 없을 때만 채택</text>
  <rect x="666" y="628" width="504" height="40" rx="20" fill="#FFF3EA" stroke="#F0C9AD" stroke-width="1.5"/>
  <path d="M684 648 l5 5 l10 -11" fill="none" stroke="#D9622B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="f" x="708" y="654" font-size="16" font-weight="600" fill="#5E3A28">테스트·채점 기준을 느슨하게 바꾸지 않음</text>
  <rect x="666" y="676" width="504" height="40" rx="20" fill="#FFF3EA" stroke="#F0C9AD" stroke-width="1.5"/>
  <path d="M684 696 l5 5 l10 -11" fill="none" stroke="#D9622B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="f" x="708" y="702" font-size="16" font-weight="600" fill="#5E3A28">플러그인 복사본으로 격리 실행, push 차단</text>
