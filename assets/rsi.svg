    <text class="f" x="124.8" y="492.0" font-size="12" font-weight="700" fill="#B9806A" letter-spacing="0.5">RE-MEASURE</text>
    <text class="f" x="124.8" y="514.0" font-size="21" font-weight="800" fill="#231A15">재측정</text>
    <text class="f" x="86.8" y="541.0" font-size="14" fill="#5E4B42">고정 시험지까지</text>
  </g>
  <g>
    <rect x="68.8" y="264.0" width="196" height="92" rx="18" fill="#FFFFFF" stroke="#EBD5C3" stroke-width="2"/>
    <circle cx="98.8" cy="294.0" r="16" fill="url(#num)"/>
    <text class="f" x="98.8" y="300.0" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">6</text>
    <text class="f" x="124.8" y="292.0" font-size="12" font-weight="700" fill="#B9806A" letter-spacing="0.5">KEEP</text>
    <text class="f" x="124.8" y="314.0" font-size="21" font-weight="800" fill="#231A15">채택·기록</text>
    <text class="f" x="86.8" y="341.0" font-size="14" fill="#5E4B42">나아졌을 때만 남김</text>
