    <text class="f" x="433.2" y="341.0" font-size="14" fill="#5E4B42">가장 낮은 채점 항목</text>
  </g>
  <g>
    <rect x="415.2" y="464.0" width="196" height="92" rx="18" fill="#FFFFFF" stroke="#EBD5C3" stroke-width="2"/>
